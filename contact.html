<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Shipfront · Contact</title>
<style>
:root{--paper:#E8E4DB;--ink:#141311;--mist:#5A564E;--signal:#FF6A00;--hair:rgba(20,19,17,0.14)}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--hair)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.mark{display:inline-block;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:.12em;font-size:14px}
.mark span{display:block;height:4px;background:var(--signal);margin-top:4px}
nav{display:flex;align-items:center;gap:20px}
nav a{text-decoration:none;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.cta{background:var(--signal);color:var(--paper);text-decoration:none;padding:0 24px;min-height:44px;display:inline-flex;align-items:center;letter-spacing:.08em;font-size:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;text-transform:uppercase}
.cta:focus{outline:2px solid var(--ink);outline-offset:2px}
.page{padding:64px 0 96px}
h1{font-size:clamp(36px,6vw,56px);line-height:.92;margin:0 0 20px}
.hours p{margin:0 0 4px}
footer{border-top:1px solid var(--hair);padding:28px 0 48px;color:var(--mist);font-size:13px;display:flex;flex-wrap:wrap;gap:16px 24px}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="mark" href="index.html" aria-label="Shipfront">SHIPFRONT<span></span></a>
  <nav>
    <a href="index.html">Why Shipfront</a>
    <a href="contact.html">Contact</a>
    <a class="cta" href="quote.html">Get a Quote</a>
  </nav>
</div></header>
<main>
<section class="page"><div class="wrap">
  <h1>Contact</h1>
  <p style="margin:20px 0; font-size:18px;">Call or Visit Us Today</p>
  <div style="margin:48px 0">
    <p class="mono" style="color:var(--mist)">Shipfront</p>
    <address style="font-style: normal;">
      <p class="mono">1933 S. Broadway<br>Los Angeles, CA 90007</p>
    </address>
  </div>
  <div style="margin:48px 0">
    <p class="mono" style="color:var(--mist)">Hours</p>
    <div class="mono hours"><p>Monday - Friday: 9 am - 5 pm</p><p>Saturday - Sunday: Appointment only</p></div>
  </div>
  <div>
    <p class="mono" style="color:var(--mist)">Email</p>
    <p><a href="mailto:info@myshipfront.com" style="font-size:18px">info@myshipfront.com</a></p>
  </div>
</div></section>
</main>
<footer class="wrap">
  <span>1933 S. Broadway, Los Angeles CA 90007</span>
  <a href="mailto:info@myshipfront.com">info@myshipfront.com</a>
  <a href="privacy.html">Privacy</a>
</footer>
</body></html>
