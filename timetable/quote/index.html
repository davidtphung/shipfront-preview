<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Get a Quote | Shipfront</title>
    <meta name="description" content="We'll use this to quote you. A person replies." />
    <link rel="icon" type="image/svg+xml" href="/shipfront-preview/timetable/favicon.svg" />
    <link rel="stylesheet" href="/shipfront-preview/timetable/assets/index-CqbLD6qj.css" />
  </head>
  <body>
    <div id="root">
      <div class="site-shell">
        <header class="site-header">
          <div class="container site-header__inner">
            <a class="wordmark" href="/shipfront-preview/timetable/">
              <svg class="wordmark__cube" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 26" aria-hidden="true">
                <polygon points="12,6 17,9 17,16 12,19 7,16 7,9" fill="#000000" stroke="#FF6A00" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/>
                <path d="M12 13 L12 19 M12 13 L7 9 M12 13 L17 9" fill="none" stroke="#FF6A00" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/>
              </svg>
              <span class="wordmark__text">
                <span class="wordmark__name">SHIPFRONT</span>
                <span class="wordmark__bar" aria-hidden="true"></span>
              </span>
            </a>
            <nav aria-label="Main">
              <ul class="nav__list">
                <li><a class="nav__link" href="/shipfront-preview/timetable/#why-shipfront">Why Shipfront</a></li>
                <li><a class="nav__link" href="/shipfront-preview/timetable/contact/">Contact</a></li>
                <li><a class="cta" href="/shipfront-preview/timetable/quote/" aria-current="page">Get a Quote</a></li>
              </ul>
            </nav>
          </div>
        </header>
        <main class="site-main" id="main">
          <div class="page-head"><div class="container"><h1 class="page-head__title">Get a Quote</h1></div></div>
          <div class="quote-body"><div class="container">
            <form class="form" action="mailto:info@myshipfront.com" method="post" enctype="text/plain">
              <div class="form__fields">
                <div class="field"><label class="field__label" for="quote-name">Name <span class="field__required">(required)</span></label><input class="input" id="quote-name" name="name" required autocomplete="name" /></div>
                <div class="field"><label class="field__label" for="quote-email">Email <span class="field__required">(required)</span></label><input class="input" id="quote-email" name="email" type="email" required autocomplete="email" /></div>
                <div class="field"><label class="field__label" for="quote-company">Company <span class="field__required">(required)</span></label><input class="input" id="quote-company" name="company" required autocomplete="organization" /></div>
              </div>
              <p class="form__disclosure">We'll use this to quote you. A person replies.</p>
              <div><button class="cta" type="submit">Send</button></div>
            </form>
          </div></div>
        </main>
        <footer class="site-footer">
          <div class="container site-footer__inner">
            <div class="site-footer__contact">
              <address class="site-footer__address">1933 S. Broadway, The Reef, Los Angeles</address>
              <a class="site-footer__link" href="mailto:info@myshipfront.com">info@myshipfront.com</a>
            </div>
            <p class="site-footer__built">Built by David T Phung.</p>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
